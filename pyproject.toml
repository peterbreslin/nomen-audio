[project]
name = "nomen-audio"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "hf-xet>=1.2.0",
    "librosa>=0.10.2.post1",
    "msclap>=1.3.4",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "uvicorn>=0.47.0",
    "wavinfo>=4.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6.20.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["frontend", "build", "dist", "data", "dev", "docs", "scripts", ".venv"]
